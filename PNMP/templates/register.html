{% extends "base.html" %}

{% block title %}Register - PNMP Health{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-6 col-lg-5">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success p-3 rounded-circle mb-3 shadow-sm">
        <i class="bi bi-person-plus-fill fs-1"></i>
      </div>
      <h3 class="fw-bold text-dark">Create Your Account</h3>
      <p class="text-muted small">Begin your personalized nutrition and AI-assisted health journey</p>
    </div>

    <div class="pnmp-card shadow-sm border p-4">
      <form method="POST" action="{{ url_for('register') }}">
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold small text-muted">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold small text-muted">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="password" class="form-label fw-semibold small text-muted">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Min. 6 chars" required minlength="6">
            </div>
          </div>
          <div class="col-md-6 mb-3">
            <label for="confirm_password" class="form-label fw-semibold small text-muted">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="6">
            </div>
          </div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="terms" required checked>
          <label class="form-check-label small text-muted" for="terms">
            I understand that PNMP offers educational nutrition guidance and not medical diagnosis.
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
          Complete Registration
        </button>

        <div class="text-center pt-2 border-top">
          <span class="text-muted small">Already have an account?</span>
          <a href="{{ url_for('login') }}" class="fw-semibold text-success ms-1 small">Sign In</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
