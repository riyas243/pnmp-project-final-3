{% extends "base.html" %}

{% block title %}Sign In - PNMP Health{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success p-3 rounded-circle mb-3 shadow-sm">
        <i class="bi bi-heart-pulse-fill fs-1"></i>
      </div>
      <h3 class="fw-bold text-dark">PNMP Sign In</h3>
      <p class="text-muted small">Personalized Nutrition & AI Meal Planning Platform</p>
    </div>

    <div class="pnmp-card shadow-sm border p-4">
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold small text-muted">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold small text-muted">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
          Sign In to Dashboard
        </button>

        <!-- Convenient Demo Credentials Helper for Examiner/Viva -->
        <button type="button" class="btn btn-sm btn-outline-secondary w-100 mb-3" onclick="fillDemoCredentials()">
          <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Use Demo Account (demo@pnmp.com)
        </button>

        <div class="text-center pt-2 border-top">
          <span class="text-muted small">Don't have an account yet?</span>
          <a href="{{ url_for('register') }}" class="fw-semibold text-success ms-1 small">Create Free Profile</a>
        </div>
      </form>
    </div>

    <!-- College Viva Info Chip -->
    <div class="text-center mt-3 text-muted" style="font-size: 0.75rem;">
      <span>Final-Year B.Sc. AI & Data Science Capstone Project</span>
    </div>
  </div>
</div>

<script>
function fillDemoCredentials() {
  document.getElementById('email').value = 'demo@pnmp.com';
  document.getElementById('password').value = 'Password123!';
}
</script>
{% endblock %}
