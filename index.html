    <script>
      try {
        if (localStorage.getItem('pnmp_theme') === 'dark' || (!localStorage.getItem('pnmp_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
